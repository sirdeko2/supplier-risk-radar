name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Smoke test the pipeline offline (bundled sample)
        run: |
          python -m supplier_radar.cli run --kev data/sample_kev.json --out out --as-of 2026-11-20
          test -f out/findings.json
          test -f out/report.html
